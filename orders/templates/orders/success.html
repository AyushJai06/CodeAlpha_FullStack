
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Order Confirmed | OnStore</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f8f9fa;
            text-align: center;
            padding: 60px 20px;
        }

        .box {
            background: white;
            max-width: 500px;
            margin: auto;
            padding: 40px;
            border-radius: 12px;
        }

        h1 {
            color: #16a34a;
        }

        a {
            display: inline-block;
            background: #2563eb;
            color: white;
            padding: 13px 25px;
            text-decoration: none;
            border-radius: 6px;
        }
    </style>
</head>

<body>

    <div class="box">

        <h1>Order Placed Successfully!</h1>

        <p>Thank you for shopping with OnStore.</p>

        <h2>Order #{{ order.id }}</h2>

        <p>Customer: {{ order.customer_name }}</p>

        <p>Total Amount: ₹{{ order.total_amount }}</p>

        <p>Payment: Cash on Delivery</p>

        <p>Status: {{ order.status }}</p>

        <br>

        <a href="/">Continue Shopping</a>

    </div>

</body>
</html>
