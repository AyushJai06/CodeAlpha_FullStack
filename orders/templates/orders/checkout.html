
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | OnStore</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f8f9fa;
            padding: 30px;
            color: #222;
        }

        .container {
            max-width: 750px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
        }

        h1 {
            color: #2563eb;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            margin: 9px 0 16px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }

        label {
            font-weight: bold;
        }

        button {
            width: 100%;
            padding: 15px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        .summary {
            background: #f1f5ff;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
        }

        .error {
            color: red;
            margin-bottom: 15px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Checkout</h1>

    <h3>Delivery Details</h3>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    <form method="POST">

        {% csrf_token %}

        <label>Full Name</label>
        <input type="text" name="name" required>

        <label>Email Address</label>
        <input type="email" name="email" required>

        <label>Mobile Number</label>
        <input type="tel" name="phone"
               pattern="[0-9]{10,15}" required>

        <label>Full Address</label>
        <textarea name="address" required></textarea>

        <label>City</label>
        <input type="text" name="city" required>

        <label>State</label>
        <input type="text" name="state" required>

        <label>PIN Code</label>
        <input type="text" name="pincode"
               pattern="[0-9]{6}" required>

        <div class="summary">

            <h3>Order Summary</h3>

            {% for item in cart_items %}

                <p>
                    {{ item.product.name }}
                    × {{ item.quantity }}
                    — ₹{{ item.subtotal }}
                </p>

            {% endfor %}

            <hr>

            <h2>Total: ₹{{ total }}</h2>

            <p>Payment Method: Cash on Delivery</p>

        </div>

        <button type="submit">
            Place Order
        </button>

    </form>

</div>

</body>
</html>
