
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register | OnStore</title>

    <style>
        body {
            font-family: Arial;
            background: #f4f6fb;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .box {
            background: white;
            padding: 35px;
            width: 350px;
            border-radius: 12px;
            box-shadow: 0 4px 15px #ddd;
        }

        h1 {
            color: #2563eb;
            text-align: center;
        }

        input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        a {
            color: #2563eb;
        }

        .helptext {
            font-size: 12px;
            color: #777;
        }

        .errorlist {
            color: red;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>OnStore.</h1>
    <h2>Create Account</h2>

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Register</button>

    </form>

    <p>Already have an account?
        <a href="{% url 'login' %}">Login</a>
    </p>

    <a href="/">Back to Home</a>

</div>

</body>
</html>
